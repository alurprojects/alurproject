<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALUR · Pipeline Chat: dari Pesan ke Task</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Skin: ALUR DESIGN.md — paper #FAF9F7, ink #111111, accent #FF5420 (stroke),
         accent-ink #C63A0F (teks aksen), muted #6B6862 (teks, 4.5:1). */
      --color-paper:   #FAF9F7;
      --color-surface: #F0EFED;
      --color-ink:     #111111;
      --color-muted:   #6B6862;
      --color-accent:  #FF5420;
      --color-accent-ink: #C63A0F;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
      font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em;
      line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Detail Pipeline Chat</p>
    <h1>ALUR — Pipeline Chat: dari Pesan ke Task</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alur-chat-sequence-title alur-chat-sequence-desc">
        <title id="alur-chat-sequence-title">Pipeline chat ALUR: pesan pengguna jadi task</title>
        <desc id="alur-chat-sequence-desc">Sequence diagram pesan chat: API memuat konteks RAG, companion mengklasifikasi, extractor menyusun draf, scheduler mengisi kapasitas, lalu balasan persona plus task tersimpan di Supabase.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B6862"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF5420"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#6B6862" stroke-width="1"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#FAF9F7"/>

        <!-- ============ LIFELINES (belakang semuanya) ============ -->
        <line x1="120" y1="56" x2="120" y2="548" stroke="rgba(17,17,17,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="360" y1="56" x2="360" y2="548" stroke="rgba(17,17,17,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="600" y1="56" x2="600" y2="548" stroke="rgba(17,17,17,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="840" y1="56" x2="840" y2="548" stroke="rgba(17,17,17,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ AKTIVASI (sebelum panah) ============ -->
        <rect x="356" y="80" width="8" height="448" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>
        <rect x="116" y="80" width="8" height="16" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>
        <rect x="116" y="470" width="8" height="50" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>
        <rect x="596" y="228" width="8" height="46" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>
        <rect x="596" y="288" width="8" height="46" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>
        <rect x="836" y="116" width="8" height="48" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>
        <rect x="836" y="400" width="8" height="16" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>
        <rect x="836" y="528" width="8" height="16" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>

        <!-- ============ FRAME ALT (di belakang pesan di dalamnya) ============ -->
        <rect x="104" y="184" width="752" height="308" rx="4" fill="rgba(17,17,17,0.02)" stroke="rgba(17,17,17,0.22)" stroke-width="1"/>
        <rect x="104" y="184" width="40" height="16" rx="2" fill="#FAF9F7" stroke="rgba(17,17,17,0.22)" stroke-width="1"/>
        <text x="124" y="196" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="116" y="212" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[TASK_CAPTURE]</text>
        <line x1="112" y1="432" x2="848" y2="432" stroke="rgba(17,17,17,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="116" y="452" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else]</text>

        <!-- ============ PANAH PESAN ============ -->
        <!-- M1: client -> api -->
        <line x1="124" y1="88" x2="356" y2="88" stroke="#6B6862" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M2: api -> db -->
        <line x1="364" y1="124" x2="836" y2="124" stroke="#6B6862" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M3: db -> api (return) -->
        <line x1="836" y1="156" x2="364" y2="156" stroke="#6B6862" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M4: api -> llm (companion) -->
        <line x1="364" y1="236" x2="596" y2="236" stroke="#6B6862" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M5: llm -> api (return) -->
        <line x1="596" y1="266" x2="364" y2="266" stroke="#6B6862" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M6: api -> llm (extractor) -->
        <line x1="364" y1="296" x2="596" y2="296" stroke="#6B6862" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M7: llm -> api (return) -->
        <line x1="596" y1="326" x2="364" y2="326" stroke="#6B6862" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M8: api self-loop (scheduler) -->
        <path d="M 364 356 L 404 356 L 404 380 L 364 380" fill="none" stroke="#6B6862" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M9: api -> db (insert) -->
        <line x1="364" y1="408" x2="836" y2="408" stroke="#6B6862" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M10: api -> client (balasan persona, region else) -->
        <line x1="356" y1="478" x2="124" y2="478" stroke="#6B6862" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M11: api -> client (headline utama, coral) -->
        <line x1="356" y1="512" x2="124" y2="512" stroke="#FF5420" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- M12: api -> db (embedding async, marker terbuka) -->
        <line x1="364" y1="536" x2="836" y2="536" stroke="#6B6862" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

        <!-- ============ LABEL + MASK KERTAS ============ -->
        <rect x="186" y="72" width="108" height="12" rx="2" fill="#FAF9F7"/>
        <text x="240" y="82" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /CHAT/MESSAGE</text>

        <rect x="546" y="108" width="108" height="12" rx="2" fill="#FAF9F7"/>
        <text x="600" y="118" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MUAT KONTEKS + RAG</text>

        <rect x="562" y="140" width="76" height="12" rx="2" fill="#FAF9F7"/>
        <text x="600" y="150" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KONTEKS SIAP</text>

        <rect x="418" y="220" width="124" height="12" rx="2" fill="#FAF9F7"/>
        <text x="480" y="230" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPANION·KLASIFIKASI</text>

        <rect x="428" y="250" width="104" height="12" rx="2" fill="#FAF9F7"/>
        <text x="480" y="260" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TYPE=TASK_CAPTURE</text>

        <rect x="434" y="280" width="92" height="12" rx="2" fill="#FAF9F7"/>
        <text x="480" y="290" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTRACTOR·DRAFT</text>

        <rect x="428" y="310" width="104" height="12" rx="2" fill="#FAF9F7"/>
        <text x="480" y="320" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JUDUL·DURASI·HARI</text>

        <rect x="412" y="366" width="116" height="12" rx="2" fill="#FAF9F7"/>
        <text x="470" y="376" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCHEDULER·KAPASITAS</text>

        <rect x="542" y="392" width="116" height="12" rx="2" fill="#FAF9F7"/>
        <text x="600" y="402" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSERT TASKS + LOGS</text>

        <rect x="194" y="462" width="92" height="12" rx="2" fill="#FAF9F7"/>
        <text x="240" y="472" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BALASAN PERSONA</text>

        <rect x="178" y="496" width="124" height="12" rx="2" fill="#FAF9F7"/>
        <text x="240" y="506" fill="#C63A0F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPLY + TONE + TASKS</text>

        <rect x="548" y="520" width="104" height="12" rx="2" fill="#FAF9F7"/>
        <text x="600" y="530" fill="#6B6862" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBEDDING (ASYNC)</text>

        <!-- ============ AKTOR ============ -->
        <rect x="40" y="16" width="160" height="40" rx="6" fill="#F0EFED" stroke="rgba(17,17,17,0.32)" stroke-width="1"/>
        <text x="120" y="34" fill="#111111" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Client</text>
        <text x="120" y="48" fill="#6B6862" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MOBILE · WEB</text>

        <rect x="280" y="16" width="160" height="40" rx="6" fill="#FFFFFF" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
        <text x="360" y="34" fill="#111111" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">API</text>
        <text x="360" y="48" fill="#6B6862" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FASTAPI · VERCEL</text>

        <rect x="520" y="16" width="160" height="40" rx="6" fill="#FFFFFF" stroke="rgba(17,17,17,0.22)" stroke-width="1"/>
        <text x="600" y="34" fill="#111111" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">LLM</text>
        <text x="600" y="48" fill="#6B6862" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">COMPANION + EXTRACTOR</text>

        <rect x="760" y="16" width="160" height="40" rx="6" fill="#F0EFED" stroke="rgba(17,17,17,0.22)" stroke-width="1"/>
        <text x="840" y="34" fill="#111111" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Supabase</text>
        <text x="840" y="48" fill="#6B6862" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POSTGRES · RLS</text>

        <!-- ============ LEGEND ============ -->
        <line x1="96" y1="580" x2="124" y2="580" stroke="#6B6862" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="132" y="583" fill="#6B6862" font-size="8.5" font-family="'Inter', sans-serif">Panggilan</text>

        <line x1="210" y1="580" x2="238" y2="580" stroke="#6B6862" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="246" y="583" fill="#6B6862" font-size="8.5" font-family="'Inter', sans-serif">Balasan / async</text>

        <line x1="358" y1="580" x2="386" y2="580" stroke="#6B6862" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="394" y="583" fill="#6B6862" font-size="8.5" font-family="'Inter', sans-serif">Async tanpa tunggu</text>

        <line x1="516" y1="580" x2="544" y2="580" stroke="#FF5420" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="552" y="583" fill="#6B6862" font-size="8.5" font-family="'Inter', sans-serif">Jawaban utama</text>

        <rect x="674" y="572" width="4" height="16" fill="rgba(17,17,17,0.06)" stroke="#6B6862" stroke-width="0.8"/>
        <text x="686" y="583" fill="#6B6862" font-size="8.5" font-family="'Inter', sans-serif">Aktivasi</text>

      </svg>
    </div>
  </div>
</body>
</html>
