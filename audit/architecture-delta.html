  <style>

      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;

    .frame { max-width: 1240px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {

      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;

      font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
      font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em;
      line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1024px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
