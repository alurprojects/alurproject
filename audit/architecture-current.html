<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALUR · Arsitektur Saat Ini + Hotspot Audit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Skin: ALUR DESIGN.md — paper #FAF9F7, ink #111111, surface #F0EFED,
         muted #7A7772 (digelapkan ke #6B6862 untuk teks kecil agar 4.5:1),
         accent Vermilion #FF5420 (stroke/fill saja, 3.06:1 non-teks),
         accent-ink #C63A0F untuk teks beraksen (4.89:1). */
      --color-paper:   #FAF9F7;
      --color-surface: #F0EFED;
      --color-ink:     #111111;
      --color-muted:   #6B6862;
      --color-soft:    #7A7772;
      --color-rule:    rgba(17,17,17,0.12);
      --color-accent:  #FF5420;
      --color-accent-ink: #C63A0F;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
      font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em;
      line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
